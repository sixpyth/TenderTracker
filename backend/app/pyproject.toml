[tool.poetry]
name = "app"
version = "0.1.0"
description = "A sample fastapi project created with create-fastapi-project"
authors = [ "Your Name <your@email.com>",]
readme = "README.md"
[[tool.poetry.packages]]
include = "app"

[tool.black]
line-length = 88
target-version = [ "py37", "py38", "py39", "py310", "py311",]
exclude = "((.eggs | .git | .pytest_cache | build | dist))"

[tool.ruff]
line-length = 88
exclude = [ ".git", "__pycache__", ".mypy_cache", ".pytest_cache",]
select = [ "E", "W", "F", "C", "B",]
ignore = [ "B904", "B006", "E501", "B008", "C901",]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [ "alembic", "__pycache__",]

[tool.build-system]
requires = [ "poetry-core",]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.109.0"
sqlmodel = "^0.0.14"
sqlalchemy = "^2.0.0"
sqlalchemy-utils = "^0.41.0"
alembic = "^1.13.0"
pydantic = "^2.6.0"
email-validator = "^2.1.0"
pydantic-settings = "^2.1.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "4.0.1"
cryptography = "^42.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
PyJWT = "^2.8.0"
redis = "^5.0.0"
asyncpg = "^0.31.0"
psycopg2-binary = "^2.9.9"
minio = "^7.2.0"
fastapi-pagination = "^0.12.14"
fastapi-async-sqlalchemy = "^0.6.1"
fastapi-cache2 = "^0.2.1"
fastapi-limiter = "^0.1.6"
python-multipart = "^0.0.9"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
psycopg = {extras = ["binary"], version = "^3.3.4"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.26.0"
black = "^26.5.1"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.per-file-ignores]
"__init__.py" = [ "F401",]
